<!DOCTYPE html>
<html lang="id">

                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        nunito: ['Nunito', 'sans-serif']

    <style>

        }

            color: white;

</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between selection:bg-brand-yellow selection:text-white">

    <!-- HEADER -->
    <header class="bg-white border-b-4 border-indigo-100 sticky top-0 z-50 shadow-sm">

            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-2xl shadow-md">
                    <i class="fa-solid fa-pen-to-square text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold text-indigo-900 leading-none">Quiz Kuis Matematika SD</h1>
                    <span class="text-xs font-semibold text-indigo-500 bg-indigo-50 px-2 py-0.5 rounded-full inline-block mt-1">30 Soal Essay • Keliling Gabungan</span>
                </div>
            </div>

            <!-- Auto-save Status & Reset -->
            <div class="flex items-center gap-3">
                <span id="save-status" class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Jawaban Tersimpan
                </span>
                <button onclick="confirmReset()" class="text-xs font-bold text-rose-600 hover:bg-rose-50 px-3 py-1.5 rounded-xl border border-rose-200 transition">
                    <i class="fa-solid fa-rotate-right"></i> Reset Semua
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full grid md:grid-cols-12 gap-6">

        <!-- KIRI: AREA SOAL (8 COLS) -->
        <section class="md:col-span-8 space-y-4">
            
            <!-- Question Card -->
            <div class="bg-white p-5 md:p-7 rounded-3xl border-2 border-slate-100 shadow-sm space-y-5">
                <div class="flex justify-between items-center border-b pb-3">
                    <span id="q-number-badge" class="bg-indigo-600 text-white text-xs md:text-sm font-bold px-3.5 py-1 rounded-full">
                        Soal 1 dari 30
                    </span>
                    <span id="q-score-badge" class="text-xs font-bold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">
                        Skor: 0 / 30
                    </span>
                </div>

                <!-- Soal Teks & Gambar -->
                <div id="q-content-area" class="space-y-4">
                    <h3 id="q-title" class="font-bold text-lg text-slate-800"></h3>
                    <p id="q-desc" class="text-sm text-slate-600 leading-relaxed"></p>

                    <!-- Frame Visual Gambar SVG -->
                    <div id="q-svg-container" class="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-center flex justify-center items-center min-h-[180px]">
                        <!-- Render SVG -->
                    </div>
                </div>

                <!-- Input Jawaban -->
                <div class="bg-slate-50 p-4 md:p-5 rounded-2xl border border-slate-200 space-y-3">
                    <label class="block font-bold text-sm text-slate-700">Masukkan Jawaban Keliling:</label>
                    <div class="flex flex-wrap sm:flex-nowrap gap-3 items-center">
                        <div class="relative w-full sm:w-48">
                            <input type="number" id="user-input-ans" placeholder="Ketik angka..." class="w-full px-4 py-2.5 border-2 border-slate-300 rounded-xl text-base font-bold focus:outline-none focus:border-indigo-500 bg-white">
                        </div>
                        <span id="q-unit" class="font-bold text-slate-600 text-sm">cm</span>
                        
                        <button onclick="checkCurrentAnswer()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2.5 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-check"></i> Periksa Jawaban
                        </button>
                    </div>
                </div>

                <!-- Feedback Instan -->
                <div id="instant-feedback" class="hidden p-4 rounded-2xl border text-sm font-bold space-y-1">
                    <!-- Dynamic Feedback -->
                </div>
            </div>

            <!-- Tombol Navigasi Bawah -->
            <div class="flex justify-between items-center gap-3">
                <button onclick="prevQuestion()" id="btn-prev" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-5 py-2.5 rounded-2xl transition flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-arrow-left"></i> Sebelumnya
                </button>
                <button onclick="nextQuestion()" id="btn-next" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2.5 rounded-2xl shadow-md transition flex items-center gap-2 text-sm">
                    Berikutnya <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

        </section>

        <!-- KANAN: KISI NAVIGASI 30 SOAL (4 COLS) -->
        <aside class="md:col-span-4 space-y-4">
            <div class="bg-white p-5 rounded-3xl border-2 border-slate-100 shadow-sm sticky top-20">
                <h3 class="font-bold text-slate-800 text-sm mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-grip text-indigo-600"></i> Navigasi Soal (1 - 30)
                </h3>

                <!-- Status Legend -->
                <div class="grid grid-cols-2 gap-2 text-[11px] mb-4 text-slate-600 font-medium">
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full bg-emerald-500 border"></span> Benar
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full bg-rose-500 border"></span> Salah
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full bg-indigo-50 border border-indigo-600"></span> Sedang Dibuka
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-3 h-3 rounded-full bg-slate-100 border border-slate-300"></span> Belum Diisi
                    </div>
                </div>

                <!-- Grid Buttons 1 - 30 -->
                <div id="nav-grid" class="grid grid-cols-5 gap-2 max-h-[360px] overflow-y-auto p-1">
                    <!-- Populated by JS -->
                </div>

                <!-- Overall Progress Bar -->
                <div class="mt-5 border-t pt-4">
                    <div class="flex justify-between text-xs font-bold text-slate-600 mb-1">
                        <span>Progres Selesai</span>
                        <span id="progress-text">0 / 30</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                        <div id="progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>
            </div>
        </aside>

    </main>

    <!-- FOOTER -->

            <p><strong>Quiz Interaktif Matematika Kelas 5 SD</strong> • Keliling Gabungan Bangun Datar</p>
        </div>
    </footer>

        // STATE MANAGEMENT
        let currentIdx = 0;
        let userAnswers = {}; // Format: { questionId: { val: number, isCorrect: boolean } }

        // LOCAL STORAGE KEYS
        const STORAGE_KEY = "quiz_keliling_gabungan_v1";

        // INIT APP
        window.onload = function() {
            loadSavedAnswers();
            renderNavGrid();
            loadQuestion(0);
        };

        // SAVE & LOAD LOCAL STORAGE
        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(userAnswers));
            const statusEl = document.getElementById('save-status');
            statusEl.classList.remove('opacity-50');
            setTimeout(() => statusEl.classList.add('opacity-50'), 1000);
        }

        function loadSavedAnswers() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    userAnswers = JSON.parse(saved);
                } catch(e) {
                    userAnswers = {};
                }
            }
        }

        function confirmReset() {
            if (confirm("Apakah kamu yakin ingin mereset semua jawaban dan memulai dari awal?")) {
                localStorage.removeItem(STORAGE_KEY);
                userAnswers = {};
                renderNavGrid();
                loadQuestion(0);
                alert("Semua jawaban berhasil direset!");
            }
        }

        // RENDER NAV GRID 1-30
        function renderNavGrid() {
            const gridContainer = document.getElementById('nav-grid');
            gridContainer.innerHTML = '';

            let totalAnswered = 0;
            let totalCorrect = 0;

            quizData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.textContent = idx + 1;
                btn.onclick = () => loadQuestion(idx);

                let classNames = "nav-grid-btn w-full h-10 rounded-xl font-bold border text-xs flex items-center justify-center transition shadow-sm ";

                if (idx === currentIdx) {
                    classNames += "current ";
                }

                if (userAnswers[q.id] !== undefined) {
                    totalAnswered++;
                    if (userAnswers[q.id].isCorrect) {
                        classNames += "answered-correct ";
                        totalCorrect++;
                    } else {
                        classNames += "answered-incorrect ";
                    }
                } else if (idx !== currentIdx) {
                    classNames += "bg-slate-50 border-slate-200 text-slate-700 hover:border-indigo-300 ";
                }

                btn.className = classNames;
                gridContainer.appendChild(btn);
            });

            // Update Progress Bar & Score
            document.getElementById('progress-text').textContent = `${totalAnswered} / 30`;
            const pct = Math.round((totalAnswered / 30) * 100);
            document.getElementById('progress-bar').style.width = `${pct}%`;
            document.getElementById('q-score-badge').textContent = `Skor: ${totalCorrect} / 30`;
        }

        // LOAD SPECIFIC QUESTION
        function loadQuestion(idx) {
            currentIdx = idx;
            const q = quizData[currentIdx];

            // Update Badges & Content
            document.getElementById('q-number-badge').textContent = `Soal ${idx + 1} dari 30`;
            document.getElementById('q-title').textContent = q.title;
            document.getElementById('q-desc').textContent = q.desc;
            document.getElementById('q-svg-container').innerHTML = q.svg;
            document.getElementById('q-unit').textContent = q.unit;

            // Handle Input Value
            const inputEl = document.getElementById('user-input-ans');
            const feedbackEl = document.getElementById('instant-feedback');

            if (userAnswers[q.id] !== undefined) {
                inputEl.value = userAnswers[q.id].val;
                showFeedback(userAnswers[q.id].isCorrect, userAnswers[q.id].val, q.unit, q.correct);
            } else {
                inputEl.value = "";
                feedbackEl.classList.add('hidden');
            }

            // Update Nav Prev/Next Buttons
            document.getElementById('btn-prev').disabled = (currentIdx === 0);
            document.getElementById('btn-prev').style.opacity = (currentIdx === 0) ? "0.5" : "1";

            if (currentIdx === quizData.length - 1) {
                document.getElementById('btn-next').innerHTML = `Selesai <i class="fa-solid fa-flag-checkered"></i>`;
            } else {
                document.getElementById('btn-next').innerHTML = `Berikutnya <i class="fa-solid fa-arrow-right"></i>`;
            }

            renderNavGrid();
        }

        // CHECK ANSWER
        function checkCurrentAnswer() {
            const q = quizData[currentIdx];
            const inputEl = document.getElementById('user-input-ans');
            const userVal = parseInt(inputEl.value);

            if (isNaN(userVal)) {
                alert("Silakan ketik angka jawaban terlebih dahulu!");
                return;
            }

            const isCorrect = (userVal === q.correct);
            
            // Store state
            userAnswers[q.id] = {
                val: userVal,
                isCorrect: isCorrect
            };

            saveToStorage();
            showFeedback(isCorrect, userVal, q.unit, q.correct);
            renderNavGrid();

            if (isCorrect) {
                confetti({ particleCount: 40, spread: 50, origin: { y: 0.7 } });
            }
        }

        function showFeedback(isCorrect, userVal, unit, correctVal) {
            const feedbackEl = document.getElementById('instant-feedback');
            feedbackEl.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-800', 'bg-rose-50', 'border-rose-200', 'text-rose-800');

            if (isCorrect) {
                feedbackEl.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-800');
                feedbackEl.innerHTML = `
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>
                        <span>JAWABAN BENAR! (${userVal} ${unit})</span>
                    </div>
                    <p class="text-xs font-normal text-emerald-700 mt-1">Luar biasa! Kamu menghitung sisi-sisi terluarnya dengan sangat tepat.</p>
                `;
            } else {
                feedbackEl.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-800');
                feedbackEl.innerHTML = `
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-circle-xmark text-rose-600 text-lg"></i>
                        <span>JAWABAN MASIH SALAH (${userVal} ${unit})</span>
                    </div>
                    <p class="text-xs font-normal text-rose-700 mt-1">Coba teliti lagi dan pastikan garis sekat/sisi bagian dalam tidak ikut dihitung ya!</p>
                `;
            }
        }

        // PREV & NEXT NAVIGATION
        function prevQuestion() {
            if (currentIdx > 0) {
                loadQuestion(currentIdx - 1);
            }
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                loadQuestion(currentIdx + 1);
            } else {
                // Selesai Quiz Summary
                const totalCorrect = Object.values(userAnswers).filter(a => a.isCorrect).length;
                alert(`Selamat! Kamu telah menyelesaikan quiz.\nSkor Akhir Kamu: ${totalCorrect} / 30 Soal Benar.`);
            }
        }
    </script>
</body>
</html>
